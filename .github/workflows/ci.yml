name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  web-static-checks:
    name: Web static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check browser JavaScript syntax
        run: node --check public/app.js

      - name: Run browser behavior and theme tests
        run: node --test tests/public-app.test.mjs

      - name: Check public site contract
        run: node scripts/check-public.mjs

  go-quality:
    name: Go quality and delivery checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files need gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check POSIX installer syntax
        run: bash -n install.sh

      - name: Run POSIX installer regression tests
        run: sh scripts/test-install-sh.sh

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./install.ps1"),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run PowerShell installer regression tests
        run: pwsh -NoProfile -File scripts/test-install-ps1.ps1

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      OUTPUT_NAME: holidaytw${{ matrix.extension }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-build CLI
        run: go build -trimpath -ldflags="-X main.version=ci" -o "${RUNNER_TEMP}/${OUTPUT_NAME}" ./cmd/holidaytw

  dotnet-tests:
    name: .NET generator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test static generator
        run: dotnet test StaticGenerator.Tests/StaticGenerator.Tests.csproj --configuration Release --verbosity normal

  npm-package-tests:
    name: npm package tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: npm/holidaytw
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # --ignore-scripts skips the package's networked postinstall (which downloads the
      # native holidaytw binary for the current platform), keeping CI hermetic. `npm ci`
      # requires the committed package-lock.json and never silently falls back to
      # `npm install`, so the lockfile stays the single source of truth on every OS.
      - name: Install dependencies (scripts disabled)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run package built-in tests
        run: npm test

  npm-package-verify:
    name: npm package verification (Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm/holidaytw
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies (scripts disabled)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Runs a real `npm pack` and asserts on the exact tarball contents (only intended
      # files, executable bin entry, license/repository metadata), rather than duplicating
      # a weaker ad hoc tar listing check here.
      - name: Verify packed tarball contents
        run: npm run pack:check

      # Forces an unsupported platform/arch so platformMatrix.resolveTarget() throws
      # synchronously, before any download would be attempted. This is a deterministic,
      # network-free smoke check of the wrapper's error handling; it must never contact
      # the (possibly unreleased) GitHub release asset for the current, supported platform.
      - name: Validate executable wrapper behavior (no network)
        shell: bash
        env:
          HOLIDAYTW_PLATFORM: plan9
          HOLIDAYTW_ARCH: mips
        run: |
          set +e
          output="$(node bin/holidaytw.js --help 2>&1)"
          status=$?
          set -e

          echo "${output}"

          if [ "${status}" -eq 0 ]; then
            echo "::error::Expected a nonzero exit code for an unsupported platform/arch"
            exit 1
          fi
          echo "${output}" | grep -qi "Unsupported platform"
