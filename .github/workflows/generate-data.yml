name: Generate Holiday Data

# This workflow uses the repository's automatic GITHUB_TOKEN and no long-lived
# Personal Access Token.
#
# A push made with GITHUB_TOKEN does not create a new workflow run, so the
# generated-data commit cannot trigger deploy-pages.yml on its own. Instead this
# workflow explicitly dispatches deploy-pages.yml (workflow_dispatch) after the
# push, which GitHub always turns into a real run. `actions: write` is required
# for that dispatch; `contents: write` is required for the commit and push.

on:
  schedule:
    # Run daily at 2 AM UTC (10 AM Taiwan time)
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "StaticGenerator/**"
      - ".github/workflows/generate-data.yml"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Default: read-only. The write scope is granted only to the job that pushes data.
permissions:
  contents: read

jobs:
  generate-data:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The automatic GITHUB_TOKEN is enough to check out and to push the
          # regenerated docs/ files; no Personal Access Token is required.
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache .NET dependencies
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          cd StaticGenerator
          dotnet restore
          cd ../StaticGenerator.Tests
          dotnet restore

      - name: Build static generator
        run: |
          cd StaticGenerator
          dotnet build --configuration Release --no-restore

      - name: Run tests
        run: |
          cd StaticGenerator.Tests
          dotnet test --configuration Release --no-restore --verbosity normal

      - name: Generate holiday data
        id: generate
        run: |
          cd StaticGenerator
          delays=(300 900 3600)
          for attempt in 1 2 3 4; do
            echo "=== Generation attempt $attempt of 4 ==="
            if dotnet run --configuration Release; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=${delays[$((attempt - 1))]}
              echo "Attempt $attempt failed; retrying in $((delay / 60)) minutes..."
              sleep "$delay"
            fi
          done
          echo "Holiday data generation failed after 4 attempts"
          exit 1
        continue-on-error: true

      - name: Commit and push changes
        id: commit
        if: steps.generate.outcome == 'success'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update holiday data - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        # A GITHUB_TOKEN push does not create a workflow run, so deploy-pages.yml
        # has to be dispatched explicitly for the new docs/ files to be published.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"; then
              echo "Dispatched deploy-pages.yml for $GITHUB_REF_NAME"
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying in 15 seconds..."
            sleep 15
          done
          echo "::error::Failed to dispatch deploy-pages.yml for $GITHUB_REF_NAME"
          exit 1

      - name: Send error notification
        if: always() && steps.generate.outcome == 'failure'
        env:
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          if [ -n "${SENDGRID_API_KEY}" ] && [ -n "${NOTIFICATION_EMAIL}" ]; then
            timestamp="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            from_email="${FROM_EMAIL:-noreply@github.com}"
            curl --fail-with-body --request POST "https://api.sendgrid.com/v3/mail/send" \
              -H "Authorization: Bearer ${SENDGRID_API_KEY}" \
              -H "Content-Type: application/json" \
              --data @- <<EOF
          {
            "personalizations": [
              {
                "to": [{"email": "${NOTIFICATION_EMAIL}"}],
                "subject": "❌ Holiday Data Generation Failed"
              }
            ],
            "from": {"email": "${from_email}"},
            "content": [
              {
                "type": "text/html",
                "value": "<h2>❌ Holiday Data Generation Failed</h2><p><strong>Repository:</strong> ${{ github.repository }}</p><p><strong>Workflow:</strong> ${{ github.workflow }}</p><p><strong>Run ID:</strong> ${{ github.run_id }}</p><p><strong>Time:</strong> ${timestamp}</p><p><strong>Details:</strong> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View workflow run</a></p>"
              }
            ]
          }
          EOF
            echo "Error notification email sent"
          else
            echo "SendGrid API key or notification email not configured, skipping email notification"
          fi

      - name: Fail workflow after generation failure
        if: always() && steps.generate.outcome == 'failure'
        run: |
          echo "Holiday data generation failed; see the Generate holiday data step for details." >&2
          exit 1
